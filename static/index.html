<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pokédex moderna consumindo a PokéAPI — busque por nome ou número, filtre por tipo, veja stats e cadeia evolutiva, e favorite seus Pokémon." />
  <meta name="theme-color" content="#0f1420" />
  <meta property="og:title" content="Pokédex — Busque e explore Pokémon" />
  <meta property="og:description" content="Busque, filtre por tipo, veja stats, evolução e favorite seus Pokémon. Dados da PokéAPI." />
  <meta property="og:type" content="website" />
  <title>Pokédex — Busque e explore Pokémon</title>
  <link rel="preconnect" href="https://pokeapi.co" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" id="brandHome" aria-label="Voltar ao início">
        <span class="brand-ball" aria-hidden="true"><span></span></span>
        <span class="brand-text">Poké<em>dex</em></span>
      </a>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Buscar por nome ou número… (ex: pikachu, 25)"
          autocomplete="off"
          aria-label="Buscar Pokémon por nome ou número"
        />
        <button id="searchClear" class="search-clear" hidden aria-label="Limpar busca">✕</button>
      </div>
      <button id="favToggle" class="fav-toggle" aria-pressed="false" title="Mostrar apenas favoritos">
        <span aria-hidden="true">★</span> Favoritos <span id="favCount" class="fav-count">0</span>
      </button>
    </div>
    <div class="filters" id="typeFilters" role="group" aria-label="Filtrar por tipo"></div>
  </header>

  <main class="container">
    <p class="result-meta" id="resultMeta" role="status" aria-live="polite"></p>
    <div class="grid" id="grid"></div>

    <div class="state" id="emptyState" hidden>
      <div class="state-art" aria-hidden="true">🔍</div>
      <h2>Nenhum Pokémon encontrado</h2>
      <p id="emptyText">Tente outro nome, número ou filtro.</p>
      <button class="btn" id="emptyReset">Limpar busca e filtros</button>
    </div>

    <div class="state" id="errorState" hidden>
      <div class="state-art" aria-hidden="true">⚠️</div>
      <h2>Algo deu errado</h2>
      <p id="errorText">Não foi possível carregar os dados.</p>
      <button class="btn" id="errorRetry">Tentar novamente</button>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" hidden>
      <button class="btn btn-primary" id="loadMore">Carregar mais</button>
    </div>
  </main>

  <footer class="footer">
    <p>Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> · Feito com FastAPI + JS puro</p>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Fechar detalhes">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
